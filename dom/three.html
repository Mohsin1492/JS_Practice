<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code with Mohsin | DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>javascript</li>
    </ul>
</body>
<script>
    // --------------- Add ---------------

    function addLanguage(langName){
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage('python')
    addLanguage('java')
    
    function optiAddLanguage(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    optiAddLanguage('typescript')
    optiAddLanguage('golang')
    // try to use .appedChild instead of using .innerHTML

    // --------------- Edit ---------------
    
    const elem = document.querySelector('li:nth-child(3)')
    const newLi = document.createElement('li')
    // newLi.innerHTML = 'MOJO'
    // newLi.textContent = 'MOJO'
    newLi.appendChild(document.createTextNode('MOJO'))
    elem.replaceWith(newLi)
    
    const firstLang = document.querySelector('li:first-child')
    firstLang.outerHTML = '<li>CPP</li>'
    

    // --------------- Remove ---------------

    const langName = document.querySelector('li:last-child')
    langName.remove()
</script>
</html>
